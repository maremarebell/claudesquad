# Render: the site as a free static site with HTTPS (phones only allow
# shaking and location over HTTPS), live at https://claudesquad.onrender.com.
# That service was made in the Render dashboard from the public repo URL with
# these same settings and headers; Render only reads this file if the repo is
# connected as a Blueprint, so change both together.
services:
  - type: web
    name: claudesquad
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./_site
    pullRequestPreviewsEnabled: true
    headers:
      # the service worker must never be cached, or a fix to it never lands
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      # Render serves .webmanifest as octet-stream otherwise
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
